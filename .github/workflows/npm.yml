name: Publish TypeScript packages

on:
  push:
    tags: ["npm-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Package version to publish from the selected ref
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate npm release tag
        env:
          A11_RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            python3 scripts/check_release_version.py npm "npm-v${A11_RELEASE_VERSION}"
          else
            python3 scripts/check_release_version.py npm "$A11_RELEASE_VERSION"
          fi
  wasm:
    needs: validate
    uses: ./.github/workflows/wasm.yml
  publish:
    needs: wasm
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Reuse tested SDK package
        uses: actions/download-artifact@v4
        with:
          name: a11-js-dist
          path: js/dist
      - name: Inspect package contents
        working-directory: js
        run: npm pack --dry-run
      - name: Publish @curiositystack/a11 and aeleven
        run: npm --prefix js run publish:registries:prebuilt
