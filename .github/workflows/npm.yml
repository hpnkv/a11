name: Publish TypeScript packages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci --prefix js
      - run: npm --prefix js test
      - name: Match release tag to package version
        if: github.event_name == 'release'
        working-directory: js
        run: test "${GITHUB_REF_NAME#v}" = "$(npm pkg get version | tr -d '\"')"
      - name: Publish @curiositystack/a11 and aeleven
        run: npm --prefix js run publish:registries
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
