name: Publish TypeScript packages

on:
  push:
    tags: ["npm-v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Validate npm release tag
        run: python3 scripts/check_release_version.py npm "$GITHUB_REF_NAME"
      - run: npm ci --prefix js
      - run: npm --prefix js test
      - name: Inspect package contents
        working-directory: js
        run: npm pack --dry-run
      - name: Publish @curiositystack/a11 and aeleven
        run: npm --prefix js run publish:registries
