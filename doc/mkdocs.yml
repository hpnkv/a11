site_name: A11
site_description: A concurrent action and streaming runtime for building AI agents
docs_dir: docs
site_dir: site

# The C++ reference under site/cpp is generated by Doxygen *after* mkdocs runs
# (see doc/build.sh), so mkdocs cannot see it at build time; don't fail --strict
# on that one link. Navigation and everything else stay validated.
validation:
  links:
    not_found: ignore

# The Python source lives one level up from this config.
watch:
  - ../a11

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.snippets:
      # Lets guides embed the runnable programs under examples/ verbatim.
      base_path:
        - ..
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          # griffe reads the package (and the sibling a11/_native.pyi stub)
          # statically, so building the docs does not require the compiled
          # native extension.
          paths: [..]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            members_order: source
            filters: ["!^_"]

nav:
  - Overview: index.md
  - Principles: principles.md
  - Build an agent: guides/build-an-agent.md
  - Python API:
      - Nodes: api/nodes.md
      - Actions: api/actions.md
      - Stores: api/stores.md
      - Transports: api/net.md
      - Sessions: api/service.md
      - Data & serialization: api/data.md
      - Observability: api/observability.md
      - Status & timing: api/status-timing.md
  - C++ internals: cpp.md
