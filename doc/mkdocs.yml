site_name: A11
site_description: >-
  A streaming action runtime for AI agents, model serving, and multimodal APIs
site_url: https://docs.a11.to/
repo_url: https://github.com/hpnkv/a11
repo_name: A11 on GitHub
docs_dir: docs
site_dir: site

# Emit self-contained ``page.html`` files instead of ``page/index.html``
# directories. Pages then link to each other with explicit ``.html`` targets,
# so the site works on any static host (or straight off the filesystem) that
# does not silently rewrite ``/foo/`` to ``/foo/index.html``. It also keeps the
# hand-written C++ page at ``site/cpp.html`` from colliding with the Doxygen
# reference that build.sh drops into ``site/cpp/`` (see cpp.md).
use_directory_urls: false

# The C++ reference under site/cpp is generated by Doxygen *after* mkdocs runs
# (see doc/build.sh), so mkdocs cannot see it at build time; don't fail --strict
# on that one link. Navigation and everything else stay validated.
validation:
  links:
    not_found: ignore

# The Python source lives one level up from this config.
watch:
  - ../a11

theme:
  name: material
  custom_dir: overrides
  logo: assets/a11-mark-header.svg
  favicon: assets/a11-mark.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.snippets:
      # Lets guides embed files from the checkout verbatim -- the runnable
      # programs under examples/, the flows under intellij-plugin/. Written
      # relative to this file; hooks/snippet_paths.py makes it absolute, because
      # pymdownx resolves it against the shell's cwd and not against the config.
      base_path:
        - ..
      check_paths: true

# Registers the generated Pygments lexer for A11 Flow, so ```a11flow blocks are
# coloured by the language's own word tables. See hooks/flow_highlighting.py.
hooks:
  - hooks/flow_highlighting.py
  - hooks/snippet_paths.py

extra_javascript:
  - assets/analytics.js

extra:
  analytics_endpoint: !ENV [A11_ANALYTICS_ENDPOINT, ""]
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hpnkv/a11
      name: A11 on GitHub

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          # griffe reads the package (and the sibling a11/_native/ stubs)
          # statically, so building the docs does not require the compiled
          # native extension.
          paths: [ .. ]
          options:
            # The stub narrows a few readers with typing.overload and, as a
            # stub, cannot carry the implementation griffe would attach them
            # to. Without this they would drop out of the reference entirely.
            # Path-relative: build.sh always runs mkdocs from doc/.
            extensions:
              - griffe_overloads.py:PromoteOverloads
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            members_order: source
            filters: [ "!^_" ]

nav:
  - Documentation:
      - Overview: index.md
      - Analytics and privacy: privacy.md
      - State machines:
          - WireStream lifecycle: lifecycles/wire-stream.md
          - AsyncNode lifecycle: lifecycles/async-node.md
          - Session lifecycle: lifecycles/session.md
          - Action lifecycle: lifecycles/action.md
      - LLM SDK:
          - Understanding interactions: llm-sdk/interactions.md
          - Actions as LLM tools: llm-sdk/action-tools.md
          - MCP servers as Actions: llm-sdk/mcp-tools.md
          - Actions as an MCP server: llm-sdk/mcp-serve.md
          - Running tool calls: llm-sdk/tool-runner.md
          - Tools with interact_with_*: llm-sdk/interact-actions.md
          - Composing tools into a flow: llm-sdk/flow-skill.md
  - Why A11: principles.md
  - Examples:
      - All examples: examples.md
      - Stream data through an AsyncNode: guides/streaming.md
      - A WebSocket echo session: guides/echo-session.md
      - Talk to a model: guides/llm.md
      - From a local run to a remote call: guides/local-to-remote.md
      - A toy agent with a tool: guides/agent-tool.md
      - Agent harnesses and evaluations: guides/harnesses-evals.md
      - Going distributed: guides/going-distributed.md
      - Browser clients: guides/browser-clients.md
      - A chat that survives a reload: guides/chat-sessions.md
      - Parallel research agent in Python: guides/deep-research.md
      - The model calls back into the page: guides/browser-tools.md
      - A port per thing the caller cares about: guides/generative-media.md
      - Local models on the web: guides/local-models-web.md
      - Compose actions without deploying code: guides/flow.md
      - Checking flows from a toolchain: guides/flow-tooling.md
      - P2P Chat Room: guides/p2p-chat.md
      - Getting the faster allocator: guides/allocator.md
      - Debugging fiber deadlocks: guides/debugging-concurrency.md
  - Python reference:
      - Nodes: api/nodes.md
      - Actions: api/actions.md
      - Stores: api/stores.md
      - Redis client: api/redis.md
      - SQLite store: api/sqlite.md
      - Transports: api/net.md
      - HTTP actions: api/http-actions.md
      - Sessions: api/service.md
      - Data & serialization: api/data.md
      - Logging: api/logging.md
      - Observability: api/observability.md
      - Status & timing: api/status-timing.md
  - Flow reference: api/flow.md
  - TypeScript reference: typescript.md
  - C++ reference: cpp.md
