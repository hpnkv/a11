org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
kotlin.code.style=official

# --- Plugin coordinates -------------------------------------------------------
pluginGroup=dev.curiositystack.a11
pluginName=A11 Chat
pluginVersion=0.5.0

# --- Target platform ----------------------------------------------------------
# The plugin itself is product-independent: it declares only
# `com.intellij.modules.platform` and touches no product-specific API, so it
# installs in every JetBrains IDE (IDEA, PyCharm, CLion, GoLand, Rider, ...).
#
# CLion is merely what it is *compiled and run* against — `runIde` launches a
# sandbox CLion. CLion product code is "CL". Bump these together with a version
# your CLion install supports (see https://plugins.jetbrains.com/docs/intellij/).
platformType=CL
platformVersion=2026.1
# The compatibility floor, and the one thing that decides which IDE builds may
# install the plugin. Kept well below the compile baseline on purpose: only
# long-stable platform API is used, and raising it would lock out IDEs for no
# gain. `pluginVerifier` is what checks that claim.
pluginSinceBuild=243
