<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>A11</title>
  <style>
    /* Theme variables; Kotlin overrides these from the IDE look-and-feel. */
    :root {
      color-scheme: var(--a11-color-scheme, dark);
      --a11-bg: var(--a11-host-bg, light-dark(#f6f8fa, #0d1117));
      --a11-bg-alt: light-dark(
        color-mix(in srgb, var(--a11-bg) 35%, #fff),
        color-mix(in srgb, var(--a11-bg) 94%, #fff)
      );
      --a11-input: light-dark(#fff, var(--a11-bg));
      --a11-fg: light-dark(#202e40, #e7eef8);
      --a11-muted: light-dark(#4e5c70, #aebed2);
      --a11-faint: light-dark(#58677a, #94a5bc);
      --a11-border: light-dark(#d0d7de, #30363d);
      --a11-soft-border: light-dark(#eaeef2, #21262d);
      --a11-control-border: light-dark(#87919c, #65717f);
      --a11-accent: light-dark(#0969da, #2ea043);
      --a11-accent-strong: light-dark(#0550ae, #238636);
      --a11-accent-fg: #ffffff;
      --a11-info: light-dark(#1666b5, #76b8ff);
      --a11-user-bg: color-mix(in srgb, var(--a11-info) 11%, var(--a11-bg-alt));
      --a11-assistant-bg: transparent;
      --a11-error: light-dark(#be303b, #ff8791);
      --a11-success: light-dark(#188544, #56d982);
      --a11-json-key: light-dark(#8250df, #d2a8ff);
      --a11-json-string: light-dark(#0a3069, #a5d6ff);
      --a11-json-number: light-dark(#0550ae, #79c0ff);
      --a11-json-keyword: light-dark(#cf222e, #ff7b72);
      --a11-flow-comment: light-dark(#6e7781, #8b949e);
      --a11-flow-string: light-dark(#0a3069, #a5d6ff);
      --a11-flow-number: light-dark(#0550ae, #79c0ff);
      --a11-flow-duration: light-dark(#0550ae, #79c0ff);
      --a11-flow-keyword: light-dark(#cf222e, #ff7b72);
      --a11-flow-declaration: light-dark(#cf222e, #ff7b72);
      --a11-flow-modifier: light-dark(#cf222e, #ff7b72);
      --a11-flow-stage: light-dark(#8250df, #d2a8ff);
      --a11-flow-builtin: light-dark(#8250df, #d2a8ff);
      --a11-flow-type: light-dark(#005461, #8ee7f2);
      --a11-flow-status: light-dark(#005461, #8ee7f2);
      --a11-flow-name: light-dark(#005461, #8ee7f2);
      --a11-flow-action: light-dark(#8250df, #d2a8ff);
      --a11-flow-node-map: light-dark(#8250df, #d2a8ff);
      --a11-flow-member: light-dark(#202e40, #c9d1d9);
      --a11-flow-port: light-dark(#202e40, #c9d1d9);
      --a11-flow-identifier: light-dark(#202e40, #c9d1d9);
      --a11-flow-operator: light-dark(#1f2328, #c9d1d9);
      --a11-flow-punctuation: light-dark(#1f2328, #c9d1d9);
      --a11-font: "Noto Sans", "Segoe UI", Arial, Helvetica, sans-serif;
      --a11-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --a11-font-size: 13px;
      %%THEME_VARS%%
    }
    body.vscode-light { color-scheme: light; }
    body.vscode-dark, body.vscode-high-contrast { color-scheme: dark; }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--a11-bg);
      color: var(--a11-fg);
      font-family: var(--a11-font);
      font-size: var(--a11-font-size);
      line-height: 1.5;
      text-align: left;
    }
    button, input, select, textarea {
      text-align: left;
    }
    /* The view mounted into #app brings its own layout; an id selector here would
       outrank the view classes below and flatten their grid/flex — keep this to
       the box itself. The top border is the separator under the tool window
       header ("A11 Chat" / "A11 Actions"), which the IDE draws above us; with
       border-box sizing it eats 1px of the 100vh rather than overflowing. */
    #app {
      height: 100vh;
      border-top: 1px solid var(--a11-border);
    }

    /* ---------- Chat ---------- */
    .chat-view { height: 100%; display: flex; flex-direction: column; }

    /* The bar above the transcript: new chat, and the history toggle. */
    .chat-bar {
      flex: 0 0 auto;
      display: flex;
      gap: 10px;
      align-items: center;
      min-height: 54px;
      padding: 10px 16px;
      border-bottom: 1px solid color-mix(in srgb, var(--a11-border) 55%, transparent);
      background: color-mix(in srgb, var(--a11-bg-alt) 78%, var(--a11-bg));
    }
    .connection-status {
      margin-right: auto;
      max-width: min(48%, 520px);
      overflow: hidden;
      color: var(--a11-muted);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .connection-status.disconnected { color: var(--a11-error); }
    button.quiet {
      background: none;
      color: var(--a11-muted);
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 12px;
    }
    button.quiet:hover:enabled { background: var(--a11-input); color: var(--a11-fg); }
    button.quiet.active { background: var(--a11-input); color: var(--a11-fg); }

    /* The history takes the transcript's place while it is open, so both are
       just rows of the same column and only one of them ever scrolls. Which one
       shows is driven by a class on the view rather than the `hidden` attribute:
       both are `display: flex`, and that outranks `[hidden] { display: none }`,
       so `hidden` alone would leave the two stacked on top of each other. */
    .history-panel {
      flex: 1 1 auto;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      background: var(--a11-bg-alt);
    }
    .chat-view:not(.history-open) .history-panel { display: none; }
    .chat-view.history-open .transcript { display: none; }
    .history-note { padding: 14px; color: var(--a11-muted); }
    .history-note.error { color: var(--a11-error); white-space: pre-wrap; }
    .history-item {
      display: flex;
      gap: 10px;
      align-items: baseline;
      width: 100%;
      text-align: left;
      background: none;
      color: var(--a11-fg);
      border: none;
      border-bottom: 1px solid var(--a11-border);
      border-radius: 0;
      padding: 9px 12px;
    }
    /* `:not(.selected)` is load-bearing: `:hover:enabled` is the more specific
       selector, so without it hovering the current conversation would paint over
       its selection colour. */
    .history-item:hover:enabled:not(.selected) { background: var(--a11-bg); }
    .history-item.selected { background: var(--a11-accent); color: var(--a11-accent-fg); }
    .history-item.selected .history-item-date { color: var(--a11-accent-fg); opacity: 0.85; }
    .history-item-title {
      flex: 1 1 auto;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .history-item-date { flex: 0 0 auto; font-size: 11px; color: var(--a11-muted); }
    .transcript {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 14px 14px 4px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      /* No smooth scrolling: token-by-token follow needs the position to settle
         synchronously, or mid-animation scroll events read as "user scrolled up". */
      overflow-anchor: none;
    }
    .chat-empty {
      display: grid;
      place-items: center;
      align-content: center;
      flex: 1 1 auto;
      min-height: 180px;
      padding: 28px;
      color: var(--a11-muted);
      text-align: center;
    }
    .chat-empty-mark {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      margin-bottom: 10px;
      border: 1px solid var(--a11-border);
      border-radius: 10px;
      color: var(--a11-accent);
      font-size: 20px;
      line-height: 1;
    }
    .chat-empty strong { color: var(--a11-fg); font-size: 14px; font-weight: 600; }
    .chat-empty p { max-width: 420px; margin: 5px 0 0; font-size: 12px; }
    .bubble {
      max-width: 92%;
      padding: 10px 14px;
      border-radius: 17px;
      white-space: normal;
      word-wrap: break-word;
      overflow-wrap: anywhere;
    }
    .bubble.user {
      align-self: flex-end;
      background: var(--a11-user-bg);
      white-space: pre-wrap;
    }
    .bubble.assistant {
      align-self: flex-start;
      background: var(--a11-assistant-bg);
      padding-inline: 2px;
      font-size: 14px;
      line-height: 1.7;
    }
    .bubble-body.muted { color: var(--a11-muted); font-style: italic; }
    .bubble-body.error { color: var(--a11-error); white-space: pre-wrap; }
    .bubble-body > :first-child { margin-top: 0; }
    .bubble-body > :last-child { margin-bottom: 0; }
    .bubble-body p { margin: 6px 0; }
    .bubble-body pre {
      background: var(--a11-bg-alt);
      border: 1px solid var(--a11-border);
      border-radius: 8px;
      padding: 10px 12px;
      overflow-x: auto;
      font-family: var(--a11-mono);
      font-size: 12px;
    }
    .bubble-body code {
      font-family: var(--a11-mono);
      font-size: 12px;
      background: var(--a11-bg-alt);
      padding: 1px 5px;
      border-radius: 5px;
    }
    .bubble-body pre code { background: none; padding: 0; }
    .bubble-body ul, .bubble-body ol { margin: 6px 0; padding-left: 22px; }
    .bubble-body a { color: var(--a11-accent); }

    .thinking { display: inline-flex; gap: 4px; align-items: center; padding: 2px 0; }
    .thinking .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--a11-muted);
      animation: a11-blink 1.2s infinite ease-in-out;
    }
    .thinking .dot:nth-child(2) { animation-delay: 0.2s; }
    .thinking .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes a11-blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

    /* Collapsible "thinking" panel: one per thinking phase, in the turn where
       that phase happened, streaming while it lasts and then collapsing to a
       single toggle (kept, not removed). Tools the model ran while still
       thinking sit inside it, between the runs of thought they came from. */
    .thinking-details {
      border-left: 2px solid var(--a11-border);
      padding-left: 8px;
    }
    .thinking-details + .bubble-body,
    .thinking-details + .tool-run,
    .bubble-body + .thinking-details,
    .tool-run + .thinking-details { margin-top: 8px; }
    .thinking-details > .tool-run { margin-top: 6px; }
    .thinking-details > .tool-run + .thoughts-body { margin-top: 6px; }
    .thinking-details > summary {
      color: var(--a11-muted);
      font-style: italic;
      cursor: pointer;
      list-style: none;
      user-select: none;
    }
    .thinking-details > summary::-webkit-details-marker { display: none; }
    .thinking-details > summary::before {
      content: '▸ ';
      display: inline-block;
      transition: transform 0.1s ease;
    }
    .thinking-details[open] > summary::before { content: '▾ '; }
    .thinking-details[open] > summary { margin-bottom: 4px; }
    .thoughts-body {
      color: var(--a11-muted);
      font-style: italic;
      white-space: pre-wrap;
      font-size: 12px;
    }

    /* One folded box per tool the model ran, in the order the turn ran them:
       summary line always visible, the rest of the plugin's run log revealed on
       click. Never sent to the model. */
    .bubble-body + .bubble-body, .tool-run + .bubble-body { margin-top: 6px; }
    .bubble-body + .tool-run { margin-top: 6px; }
    .tool-run + .tool-run { margin-top: 4px; }
    .tool-run {
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--a11-info) 22%, var(--a11-border));
      border-radius: 12px;
      background: color-mix(in srgb, var(--a11-info) 7%, var(--a11-bg));
      box-shadow: 0 2px 8px color-mix(in srgb, #000 12%, transparent);
      font-size: 12px;
    }
    .tool-run > summary {
      display: grid;
      grid-template-columns: auto auto minmax(0, 1fr);
      align-items: start;
      gap: 8px;
      padding: 12px 16px;
      cursor: pointer;
      list-style: none;
      user-select: none;
    }
    .tool-run.empty > summary { cursor: default; }
    .tool-run > summary::-webkit-details-marker { display: none; }
    .tool-run > summary::before { content: '▸'; margin-top: 2px; color: var(--a11-muted); font-size: 10px; }
    .tool-run[open] > summary::before { content: '▾'; }
    .tool-run.empty > summary::before { visibility: hidden; }
    .tool-run-icon { margin-top: 2px; color: var(--a11-info); }
    .tool-run.failed .tool-run-icon { color: var(--a11-error); }
    .tool-run-heading { display: block; min-width: 0; }
    .tool-run-heading-row { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .tool-run-name { min-width: 0; overflow: hidden; color: var(--a11-fg); font-size: 12px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
    .tool-run-summary {
      display: -webkit-box;
      min-width: 0;
      max-height: 32px;
      margin-top: 4px;
      overflow: hidden;
      overflow-wrap: anywhere;
      color: var(--a11-muted);
      font-family: var(--a11-mono);
      font-size: 10px;
      font-weight: 400;
      line-height: 16px;
      white-space: pre-wrap;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }
    .tool-run-state { margin-left: auto; padding: 2px 8px; border-radius: 999px; color: var(--a11-muted); font-size: 10px; font-weight: 400; white-space: nowrap; }
    .flow-preview {
      width: 100%;
      max-height: 7.5rem;
      margin: 8px 0 0;
      overflow: auto;
      border: 1px solid var(--a11-border);
      border-radius: 6px;
      background: var(--a11-bg);
      color: var(--a11-fg);
      padding: 7px;
      font-family: var(--a11-mono);
      font-size: 10px;
      line-height: 1.45;
      white-space: pre;
    }
    .flow-preview.complete { max-height: none; overflow-x: auto; overflow-y: visible; }
    .tool-run.failed {
      border-color: color-mix(in srgb, var(--a11-error) 35%, var(--a11-border));
      background: color-mix(in srgb, var(--a11-error) 3%, var(--a11-bg));
    }
    .tool-run.failed .tool-run-state { background: color-mix(in srgb, var(--a11-error) 10%, transparent); color: var(--a11-error); }
    .tool-run.failed .tool-run-summary { color: var(--a11-error); }
    .tool-run-error-preview {
      display: -webkit-box;
      max-width: 100%;
      margin: 8px 0 0;
      overflow: hidden;
      overflow-wrap: anywhere;
      padding: 8px 12px;
      border-left: 2px solid var(--a11-error);
      border-radius: 6px;
      background: color-mix(in srgb, var(--a11-error) 5%, var(--a11-bg));
      color: var(--a11-error);
      font-size: 10px;
      font-weight: 400;
      line-height: 16px;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
    }
    .tool-run-body {
      display: grid;
      gap: 9px;
      padding: 12px 16px;
      border-top: 1px solid var(--a11-border);
      color: var(--a11-fg);
      overflow-wrap: anywhere;
    }
    .tool-run-body > :first-child { margin-top: 0; }
    .tool-run-body > :last-child { margin-bottom: 0; }
    .tool-run-body p { margin: 5px 0; }
    .tool-run-body ul, .tool-run-body ol { margin: 5px 0; padding-left: 20px; }
    .tool-run-body code { font-family: var(--a11-mono); font-size: 11px; }
    .tool-run-body pre {
      background: var(--a11-bg);
      border: 1px solid var(--a11-border);
      border-radius: 6px;
      padding: 8px;
      overflow-x: auto;
      font-size: 11px;
    }
    .tool-detail-section > strong {
      display: block;
      margin-bottom: 4px;
      color: var(--a11-muted);
      font-size: 10px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .tool-detail-value {
      max-height: 220px;
      margin: 0;
      overflow: auto;
      white-space: pre-wrap;
    }
    .tool-detail-value.empty { color: var(--a11-muted); }
    .tool-run-failure {
      max-height: 12rem;
      overflow: auto;
      overflow-wrap: anywhere;
      padding: 8px 12px;
      border-left: 2px solid var(--a11-error);
      border-radius: 6px;
      background: color-mix(in srgb, var(--a11-error) 5%, var(--a11-bg));
      color: var(--a11-error);
      white-space: pre-wrap;
    }
    .tool-run.patch-run {
      border-color: color-mix(in srgb, var(--a11-accent) 30%, var(--a11-border));
      background: var(--a11-assistant-bg);
    }
    .tool-run.patch-run > summary { background: color-mix(in srgb, var(--a11-accent) 5%, transparent); }
    .tool-run.patch-run .tool-run-icon { color: var(--a11-accent); }
    .tool-run.patch-run .tool-run-body { padding: 0; }
    .patch-result { display: grid; min-width: 0; }
    .patch-file + .patch-file { border-top: 1px solid var(--a11-border); }
    .patch-file > header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      background: color-mix(in srgb, var(--a11-fg) 3%, transparent);
    }
    .patch-file > header code { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .patch-counts { display: flex; gap: 7px; margin-left: auto; font-size: 10px; font-style: normal; }
    .patch-counts b { color: var(--a11-success); }
    .patch-counts i { color: var(--a11-error); font-style: normal; font-weight: 600; }
    .patch-lines { max-height: 360px; overflow: auto; background: var(--a11-bg); }
    .patch-line {
      display: grid;
      grid-template-columns: 4.5ch 2ch minmax(max-content, 1fr);
      min-width: max-content;
      font-family: var(--a11-mono);
      font-size: 11px;
      line-height: 19px;
      white-space: pre;
    }
    .patch-line-number { padding-right: 8px; color: var(--a11-muted); text-align: right; user-select: none; }
    .patch-line-marker { text-align: center; user-select: none; }
    .patch-line code { padding-right: 12px; font: inherit; }
    .patch-line.added { background: color-mix(in srgb, var(--a11-success) 13%, var(--a11-bg)); }
    .patch-line.added .patch-line-marker { color: var(--a11-success); }
    .patch-line.removed { background: color-mix(in srgb, var(--a11-error) 12%, var(--a11-bg)); }
    .patch-line.removed .patch-line-marker { color: var(--a11-error); }
    .bubble-body + .completion-report,
    .tool-run + .completion-report,
    .completion-report + .bubble-body { margin-top: 8px; }
    .completion-report {
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--a11-accent) 48%, var(--a11-border));
      border-radius: 10px;
      background: var(--a11-assistant-bg);
      font-size: 12px;
    }
    .completion-header {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 9px;
      align-items: center;
      padding: 9px 11px;
    }
    .completion-icon {
      display: grid;
      width: 22px;
      height: 22px;
      place-items: center;
      border-radius: 50%;
      background: color-mix(in srgb, var(--a11-accent) 18%, transparent);
      color: var(--a11-accent);
      font-weight: 700;
    }
    .completion-heading {
      display: flex;
      min-width: 0;
      flex-direction: column;
      line-height: 1.35;
    }
    .completion-heading strong { color: var(--a11-fg); font-size: 13px; }
    .completion-heading span, .completion-state { color: var(--a11-muted); }
    .completion-state { white-space: nowrap; font-size: 11px; }
    .completion-content {
      padding: 10px 11px;
      border-top: 1px solid var(--a11-border);
      background: var(--a11-bg);
    }
    .completion-summary { font-size: 13px; }
    .completion-summary > :first-child { margin-top: 0; }
    .completion-summary > :last-child { margin-bottom: 0; }
    .completion-sections {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 8px;
      margin-top: 9px;
    }
    .completion-section {
      min-width: 0;
      padding: 7px 9px;
      border: 1px solid var(--a11-border);
      border-radius: 7px;
      background: var(--a11-bg-alt);
    }
    .completion-section > strong {
      display: block;
      margin-bottom: 3px;
      color: var(--a11-muted);
      font-size: 10px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .completion-section > div { white-space: pre-wrap; overflow-wrap: anywhere; }
    .completion-technical { border-top: 1px solid var(--a11-border); }
    .completion-technical > summary {
      padding: 6px 11px;
      color: var(--a11-muted);
      cursor: pointer;
      list-style-position: inside;
      user-select: none;
    }
    .completion-log {
      max-height: 160px;
      overflow: auto;
      padding: 0 11px 9px;
      color: var(--a11-muted);
      font-family: var(--a11-mono);
      font-size: 11px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .completion-report.failed { border-color: var(--a11-error); }
    .completion-report.failed .completion-icon {
      background: color-mix(in srgb, var(--a11-error) 16%, transparent);
      color: var(--a11-error);
    }
    .completion-report.failed .completion-state { color: var(--a11-error); }
    .bubble-body + .input-request-report,
    .tool-run + .input-request-report,
